<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollegePortal - Secure Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="login-container">
        <div class="login-header">
            <h2>Welcome Back, Student!</h2>
            <p>Access your AIML Placement Prediction Dashboard</p>
        </div>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your GitHub/Portal username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your secure password" required>
            </div>
            
            <button type="submit" class="btn-primary">Secure Login</button>
        </form>
        <div id="authErrorMessage" class="error-message"></div>
    </div>

    <script src="app.js"></script>
    <script>
        // Inline guard checking if user is already authenticated
        if (localStorage.getItem('accessToken')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
